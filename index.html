<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비밀 전화기</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            width: 100%;
            max-width: 380px;
            height: 650px;
            background-color: #000;
            border-radius: 30px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        .display-screen {
            text-align: center;
            margin-top: 20px;
            height: 100px;
        }
        .phone-number {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 2px;
            min-height: 40px;
            color: #fff;
        }
        .status-text {
            font-size: 16px;
            color: #8e8e93;
            margin-top: 10px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 0 10px;
        }
        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #333333;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            font-size: 28px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .key:active {
            background-color: #666666;
        }
        .key-sub {
            font-size: 10px;
            letter-spacing: 1px;
            color: #aaa;
            margin-top: -2px;
        }
        .actions {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }
        .btn-call {
            background-color: #34c759;
            color: white;
        }
        .btn-call:active {
            background-color: #248a3d;
        }
        .btn-end {
            background-color: #ff3b30;
            color: white;
            display: none;
        }
        .btn-delete {
            background-color: transparent;
            font-size: 18px;
            color: #8e8e93;
        }
        .empty-space { width: 75px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="display-screen">
        <div class="phone-number" id="numberDisplay"></div>
        <div class="status-text" id="statusDisplay">전화번호를 입력하세요</div>
    </div>

    <!-- 키패드 -->
    <div class="keypad">
        <div class="key" onclick="press('1')">1<span class="key-sub">&nbsp;</span></div>
        <div class="key" onclick="press('2')">2<span class="key-sub">ABC</span></div>
        <div class="key" onclick="press('3')">3<span class="key-sub">DEF</span></div>
        <div class="key" onclick="press('4')">4<span class="key-sub">GHI</span></div>
        <div class="key" onclick="press('5')">5<span class="key-sub">JKL</span></div>
        <div class="key" onclick="press('6')">6<span class="key-sub">MNO</span></div>
        <div class="key" onclick="press('7')">7<span class="key-sub">PQRS</span></div>
        <div class="key" onclick="press('8')">8<span class="key-sub">TUV</span></div>
        <div class="key" onclick="press('9')">9<span class="key-sub">WXYZ</span></div>
        <div class="key" onclick="press('*')">*<span class="key-sub">&nbsp;</span></div>
        <div class="key" onclick="press('0')">0<span class="key-sub">+</span></div>
        <div class="key" onclick="press('#')">#<span class="key-sub">&nbsp;</span></div>
    </div>

    <!-- 통화 / 삭제 버튼 -->
    <div class="actions">
        <div class="empty-space"></div>
        <div class="key btn-call" id="callBtn" onclick="makeCall()">📞</div>
        <div class="key btn-end" id="endBtn" onclick="endCall()">📵</div>
        <div class="key btn-delete" id="deleteBtn" onclick="pressDelete()">⌫</div>
    </div>
</div>
<script>
    // ==========================================
    // ⚙️ [설정] 암호 번호와 음성 멘트를 여러 개 추가하세요!
    // ==========================================
    const SECRET_MESSAGES = {
        "0701": "반갑습니다, 친구님. 비밀번호는 사 사 대문자 i 칠 소문자 f n d 입니다. bitly와 연결하십시오.", // [넘버1 : 메시지1]
        "112": "제보 전화 감사합니다. 추가 자료는 삼 대문자 r 소문자 y 사 대문자 a j i 입니다. bitly와 연결하십시오.", // [넘버2 : 메시지2]
        // 원하는 만큼 "번호": "출력할 음성" 형식으로 계속 추가할 수 있습니다!
    };
    // ==========================================

    let currentInput = "";
    let isCalling = false;
    let ringtoneTimer = null;

    // Web Audio API로 가짜 클래식 신호음 생성
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playDialTone() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.8);
    }

    function press(num) {
        if (isCalling) return;
        if (currentInput.length < 12) {
            currentInput += num;
            updateDisplay();
        }
    }

    function pressDelete() {
        if (isCalling) return;
        currentInput = currentInput.slice(0, -1);
        updateDisplay();
    }

    function updateDisplay() {
        document.getElementById("numberDisplay").innerText = currentInput;
    }

    function makeCall() {
        if (currentInput === "" || isCalling) return;
        
        isCalling = true;
        document.getElementById("statusDisplay").innerText = "신호 연결 중...";
        document.getElementById("callBtn").style.display = "none";
        document.getElementById("endBtn").style.display = "flex";

        // 아이패드/아이폰 소리 차단 해제 세팅
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        }

        // 신호음 재생
        playDialTone();

        // 입력한 번호가 목록에 있는지 체크
        const matchedMessage = SECRET_MESSAGES[currentInput];

        ringtoneTimer = setTimeout(() => {
            if (matchedMessage) {
                // 번호가 일치할 때
                document.getElementById("statusDisplay").innerText = "통화 중 [보안 채널]";
                playSecretVoice(matchedMessage);
            } else {
                // 등록되지 않은 번호일 때
                document.getElementById("statusDisplay").innerText = "올바르지 않은 암호입니다.";
                setTimeout(endCall, 2000); 
            }
        }, 1800);
    }

    function playSecretVoice(messageText) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(messageText);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.85; 
            
            utterance.onend = function() {
                setTimeout(endCall, 1000); 
            };
            window.speechSynthesis.speak(utterance);
        }
    }

    function endCall() {
        isCalling = false;
        clearTimeout(ringtoneTimer);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        
        document.getElementById("statusDisplay").innerText = "연결이 종료되었습니다.";
        document.getElementById("callBtn").style.display = "flex";
        document.getElementById("endBtn").style.display = "none";
        
        setTimeout(() => {
            currentInput = "";
            updateDisplay();
            document.getElementById("statusDisplay").innerText = "암호 번호를 입력하십시오";
        }, 1500);
    }
</script>
</body>
</html>
